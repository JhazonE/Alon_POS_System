<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    a { color: #F2A93A; } a:hover { color: #F7C173; }
  </style>
</helmet>

<div style="width: 300px; height: 960px; background: #EFF6F5; display: flex;">
  <div style="width: 272px; height: 960px; background: #0B2A2D; display: flex; flex-direction: column;">

    <!-- header: editorial wordmark -->
    <div style="padding: 24px 22px 20px 22px;">
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-size: 21px; font-weight: 800; letter-spacing: -0.02em; color: #F2A93A; line-height: 1;">ALON</div>
        <div style="font-size: 21px; font-weight: 300; letter-spacing: -0.01em; color: #DCF2F0; line-height: 1;">POS</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; margin-top: 9px;">
        <div style="height: 2px; width: 20px; background: #F2A93A;"></div>
        <div style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.26em; color: rgba(192,232,230,0.5);">ENTERPRISE</div>
      </div>
    </div>

    <!-- search -->
    <div style="padding: 0 22px 6px 22px;">
      <div style="display: flex; align-items: center; gap: 10px; height: 34px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.42)" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="font-size: 13px; color: rgba(192,232,230,0.42); flex-grow: 1;">Search</span>
        <span style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; color: rgba(242,169,58,0.7);">⌘K</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; padding: 10px 22px 0 22px; flex-grow: 1;">

      <!-- group label with rule -->
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 0 8px 0;">
        <span style="font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em; color: #F2A93A;">OVERVIEW</span>
        <span style="height: 1px; flex-grow: 1; background: rgba(242,169,58,0.18);"></span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        <span>Dashboard</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0 8px 0;">
        <span style="font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em; color: #F2A93A;">SELL</span>
        <span style="height: 1px; flex-grow: 1; background: rgba(242,169,58,0.18);"></span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: #F2A93A; font-size: 13.5px; font-weight: 600;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.3 9 5.2v9L12 21l-9-5.2v-9z"></path><path d="m3 10.5 9 5.2 9-5.2"></path></svg>
        <span style="flex-grow: 1;">Products</span>
        <span style="width: 5px; height: 5px; border-radius: 50%; background: #F2A93A;"></span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M6 17V9"></path><path d="M11 17V5"></path><path d="M16 17v-5"></path></svg>
        <span style="flex-grow: 1;">Sales</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0 8px 0;">
        <span style="font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em; color: #F2A93A;">PURCHASING</span>
        <span style="height: 1px; flex-grow: 1; background: rgba(242,169,58,0.18);"></span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h2.2l2.4 12h11.6l2.2-8H6"></path></svg>
        <span style="flex-grow: 1;">Purchase Orders</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path><path d="M17 11.5a3 3 0 0 0 0-6"></path></svg>
        <span style="flex-grow: 1;">Suppliers</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0 8px 0;">
        <span style="font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em; color: #F2A93A;">OPERATIONS</span>
        <span style="height: 1px; flex-grow: 1; background: rgba(242,169,58,0.18);"></span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12"></path><path d="M8 21v-7h8v7"></path></svg>
        <span style="flex-grow: 1;">Inventory</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"></path></svg>
        <span style="flex-grow: 1;">Customers</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.32)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0 8px 0;">
        <span style="font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em; color: #F2A93A;">INSIGHTS</span>
        <span style="height: 1px; flex-grow: 1; background: rgba(242,169,58,0.18);"></span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11"></path><path d="M10 19V5"></path><path d="M16 19v-6"></path><path d="M21 19H3"></path></svg>
        <span>Reports</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px; padding: 14px 0 8px 0;">
        <span style="font-size: 8.5px; font-weight: 700; letter-spacing: 0.2em; color: #F2A93A;">ADMIN</span>
        <span style="height: 1px; flex-grow: 1; background: rgba(242,169,58,0.18);"></span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"></rect><path d="m9.5 12.5 1.8 1.8 3.4-3.4"></path></svg>
        <span style="flex-grow: 1;">Approvals Board</span>
        <span style="font-size: 10px; font-weight: 700; color: #F2A93A;">4</span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path><path d="M17 11.5a3 3 0 0 0 0-6"></path></svg>
        <span>User Management</span>
      </div>
      <div style="height: 36px; display: flex; align-items: center; gap: 12px; color: rgba(192,232,230,0.6); font-size: 13.5px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"></path></svg>
        <span>Settings</span>
      </div>

      <div style="flex-grow: 1;"></div>
    </div>

    <!-- footer -->
    <div style="display: flex; align-items: center; gap: 12px; padding: 16px 22px 22px 22px;">
      <div style="width: 34px; height: 34px; border-radius: 50%; background: #0B2A2D; border: 1.5px solid #F2A93A; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11.5px; font-weight: 700; color: #F2A93A;">TA</div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 12.5px; font-weight: 600; color: #DCF2F0;">Test Admin</div>
        <div style="font-size: 9.5px; letter-spacing: 0.1em; color: rgba(192,232,230,0.4);">ADMINISTRATOR</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
