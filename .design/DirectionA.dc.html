<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    a { color: #2DA5B0; } a:hover { color: #55C3CB; }
    .rowA { box-shadow: inset 1px 0 0 rgba(192,232,230,0.14); }
    .rowA-on { box-shadow: inset 2px 0 0 #2DA5B0; }
  </style>
</helmet>

<div style="width: 300px; height: 940px; background: #EFF6F5; display: flex;">
  <div style="width: 264px; height: 940px; background: #0B2A2D; border-right: 1px solid #174145; display: flex; flex-direction: column;">

    <!-- header -->
    <div style="display: flex; align-items: center; gap: 11px; padding: 20px 20px 18px 20px;">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #0E7C86; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EFF6F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c2.6 0 2.6-3 5.2-3s2.6 3 5.2 3 2.6-3 5.2-3 2.6 3 5.2 3"></path><path d="M3 9c2.6 0 2.6-3 5.2-3s2.6 3 5.2 3 2.6-3 5.2-3 2.6 3 5.2 3"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 12.5px; font-weight: 700; letter-spacing: 0.04em; color: #DCF2F0;">ALON POS SYSTEM</div>
        <div style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.2em; color: rgba(192,232,230,0.42);">ENTERPRISE</div>
      </div>
    </div>

    <!-- search: bare underline, no box -->
    <div style="padding: 0 20px 4px 20px;">
      <div style="display: flex; align-items: center; gap: 9px; padding-bottom: 9px; border-bottom: 1px solid #174145;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.4)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="font-size: 12.5px; color: rgba(192,232,230,0.4); flex-grow: 1;">Search</span>
        <span style="font-size: 9.5px; color: rgba(192,232,230,0.3); letter-spacing: 0.04em;">CTRL K</span>
      </div>
    </div>

    <!-- nav -->
    <div style="display: flex; flex-direction: column; padding: 14px 20px 0 20px; flex-grow: 1; overflow: hidden;">

      <div style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: rgba(192,232,230,0.32); padding: 0 0 7px 14px;">OVERVIEW</div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
        <span>Dashboard</span>
      </div>

      <div style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: rgba(192,232,230,0.32); padding: 16px 0 7px 14px;">SELL</div>
      <div class="rowA rowA-on" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: #E4F6F4; font-size: 13px; font-weight: 500;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#2DA5B0" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.3 9 5.2v9L12 21l-9-5.2v-9z"></path><path d="m3 10.5 9 5.2 9-5.2"></path></svg>
        <span>Products</span>
      </div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M6 17V9"></path><path d="M11 17V5"></path><path d="M16 17v-5"></path></svg>
        <span style="flex-grow: 1;">Sales</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>

      <div style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: rgba(192,232,230,0.32); padding: 16px 0 7px 14px;">PURCHASING</div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h2.2l2.4 12h11.6l2.2-8H6"></path></svg>
        <span style="flex-grow: 1;">Purchase Orders</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path><path d="M17 11.5a3 3 0 0 0 0-6"></path><path d="M19 20c0-2.6-1-4.3-2.6-5.1"></path></svg>
        <span style="flex-grow: 1;">Suppliers</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>

      <div style="height: 16px;"></div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12"></path><path d="M8 21v-7h8v7"></path></svg>
        <span style="flex-grow: 1;">Inventory</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"></path></svg>
        <span style="flex-grow: 1;">Customers</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
      </div>

      <div style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: rgba(192,232,230,0.32); padding: 16px 0 7px 14px;">INSIGHTS</div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11"></path><path d="M10 19V5"></path><path d="M16 19v-6"></path><path d="M21 19H3"></path></svg>
        <span>Reports</span>
      </div>

      <div style="font-size: 8.5px; font-weight: 600; letter-spacing: 0.16em; color: rgba(192,232,230,0.32); padding: 16px 0 7px 14px;">ADMIN</div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"></rect><path d="M9 4V3h6v1"></path><path d="m9.5 12.5 1.8 1.8 3.4-3.4"></path></svg>
        <span>Approvals Board</span>
      </div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path><path d="M17 11.5a3 3 0 0 0 0-6"></path></svg>
        <span>User Management</span>
      </div>
      <div class="rowA" style="height: 38px; display: flex; align-items: center; gap: 11px; padding-left: 14px; color: rgba(192,232,230,0.62); font-size: 13px;">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 3 14.2H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 7a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 9.8 3a2 2 0 1 1 4 0v.1A1.6 1.6 0 0 0 17 4.6c.6.3 1.3.2 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"></path></svg>
        <span>Settings</span>
      </div>
    </div>

    <!-- footer -->
    <div style="display: flex; align-items: center; gap: 11px; padding: 14px 20px 18px 20px; border-top: 1px solid #174145;">
      <div style="width: 32px; height: 32px; border-radius: 50%; background: #143A3D; border: 1px solid #1F5155; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 600; color: #9FD8D4;">TA</div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 12px; font-weight: 500; color: #DCF2F0;">Test Admin</div>
        <div style="font-size: 10px; color: rgba(192,232,230,0.4);">View Profile</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
