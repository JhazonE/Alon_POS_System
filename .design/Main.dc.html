<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    body { margin: 0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    a { color: #2DA5B0; } a:hover { color: #55C3CB; }
  </style>
</helmet>

<div style="width: 300px; height: 980px; background: #EFF6F5; padding: 10px; box-sizing: border-box; display: flex;">
  <div style="width: 280px; background: #0B2A2D; border: 1px solid #174145; border-radius: 16px; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

    <!-- header -->
    <div style="display: flex; align-items: center; gap: 10px; padding: 16px 14px 14px 14px;">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #0E7C86; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EFF6F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15c2.6 0 2.6-3 5.2-3s2.6 3 5.2 3 2.6-3 5.2-3 2.6 3 5.2 3"></path><path d="M3 9c2.6 0 2.6-3 5.2-3s2.6 3 5.2 3 2.6-3 5.2-3 2.6 3 5.2 3"></path></svg>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.03em; color: #DCF2F0;">ALON POS SYSTEM</div>
        <div style="font-size: 8px; font-weight: 600; letter-spacing: 0.18em; color: rgba(192,232,230,0.4);">ENTERPRISE</div>
      </div>
    </div>

    <!-- search: filled box + key chip -->
    <div style="padding: 0 12px 12px 12px;">
      <div style="display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; background: #123033; border: 1px solid #1B4448; border-radius: 10px;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.45)" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <span style="font-size: 12px; color: rgba(192,232,230,0.45); flex-grow: 1;">Search</span>
        <span style="font-size: 9px; font-weight: 600; color: rgba(192,232,230,0.4); background: #1B4448; border-radius: 5px; padding: 3px 5px;">⌘K</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px; padding: 0 12px; flex-grow: 1;">

      <!-- OVERVIEW card -->
      <div style="background: #0F3336; border: 1px solid #17403F; border-radius: 12px; padding: 9px 8px; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 8px; font-weight: 700; letter-spacing: 0.15em; color: rgba(192,232,230,0.34); padding: 2px 0 6px 8px;">OVERVIEW</div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
          </span>
          <span>Dashboard</span>
        </div>
      </div>

      <!-- SELL card, active row filled -->
      <div style="background: #0F3336; border: 1px solid #17403F; border-radius: 12px; padding: 9px 8px; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 8px; font-weight: 700; letter-spacing: 0.15em; color: rgba(192,232,230,0.34); padding: 2px 0 6px 8px;">SELL</div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; background: #0E7C86; color: #FFFFFF; font-size: 12.5px; font-weight: 600;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.18); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7.5 4.3 9 5.2v9L12 21l-9-5.2v-9z"></path><path d="m3 10.5 9 5.2 9-5.2"></path></svg>
          </span>
          <span>Products</span>
        </div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M6 17V9"></path><path d="M11 17V5"></path><path d="M16 17v-5"></path></svg>
          </span>
          <span style="flex-grow: 1;">Sales</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
      </div>

      <!-- PURCHASING card -->
      <div style="background: #0F3336; border: 1px solid #17403F; border-radius: 12px; padding: 9px 8px; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 8px; font-weight: 700; letter-spacing: 0.15em; color: rgba(192,232,230,0.34); padding: 2px 0 6px 8px;">PURCHASING</div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1.4"></circle><circle cx="18" cy="20" r="1.4"></circle><path d="M2 3h2.2l2.4 12h11.6l2.2-8H6"></path></svg>
          </span>
          <span style="flex-grow: 1;">Purchase Orders</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path><path d="M17 11.5a3 3 0 0 0 0-6"></path></svg>
          </span>
          <span style="flex-grow: 1;">Suppliers</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
      </div>

      <!-- OPERATIONS card, Inventory accordion open -->
      <div style="background: #0F3336; border: 1px solid #17403F; border-radius: 12px; padding: 9px 8px; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 8px; font-weight: 700; letter-spacing: 0.15em; color: rgba(192,232,230,0.34); padding: 2px 0 6px 8px;">OPERATIONS</div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; background: #143A3D; color: #DCF2F0; font-size: 12.5px; font-weight: 500;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.2); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4FC3C9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12"></path><path d="M8 21v-7h8v7"></path></svg>
          </span>
          <span style="flex-grow: 1;">Inventory</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.55)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"></path></svg>
        </div>
        <div style="display: flex; flex-direction: column; gap: 1px; margin: 3px 0 3px 19px; padding-left: 12px; border-left: 1px solid #1F5155;">
          <div style="height: 28px; display: flex; align-items: center; border-radius: 7px; padding: 0 8px; color: rgba(192,232,230,0.6); font-size: 12px;">Stock Levels</div>
          <div style="height: 28px; display: flex; align-items: center; border-radius: 7px; padding: 0 8px; color: rgba(192,232,230,0.6); font-size: 12px;">Stock Counts</div>
          <div style="height: 28px; display: flex; align-items: center; border-radius: 7px; padding: 0 8px; color: rgba(192,232,230,0.6); font-size: 12px;">Repackaging</div>
        </div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"></circle><path d="M5 20c0-3.6 3-6 7-6s7 2.4 7 6"></path></svg>
          </span>
          <span style="flex-grow: 1;">Customers</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.35)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>
        </div>
      </div>

      <!-- INSIGHTS + ADMIN card -->
      <div style="background: #0F3336; border: 1px solid #17403F; border-radius: 12px; padding: 9px 8px; display: flex; flex-direction: column; gap: 2px;">
        <div style="font-size: 8px; font-weight: 700; letter-spacing: 0.15em; color: rgba(192,232,230,0.34); padding: 2px 0 6px 8px;">INSIGHTS &amp; ADMIN</div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V11"></path><path d="M10 19V5"></path><path d="M16 19v-6"></path><path d="M21 19H3"></path></svg>
          </span>
          <span>Reports</span>
        </div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"></rect><path d="m9.5 12.5 1.8 1.8 3.4-3.4"></path></svg>
          </span>
          <span style="flex-grow: 1;">Approvals Board</span>
          <span style="font-size: 9px; font-weight: 700; color: #0B2A2D; background: #F2A93A; border-radius: 20px; padding: 2px 6px;">4</span>
        </div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"></circle><path d="M3 20c0-3.3 2.7-5.4 6-5.4s6 2.1 6 5.4"></path></svg>
          </span>
          <span>User Management</span>
        </div>
        <div style="height: 32px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 8px; color: rgba(192,232,230,0.66); font-size: 12.5px;">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: rgba(45,165,176,0.13); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19 12a7 7 0 0 0-.1-1.2l2-1.5-2-3.4-2.3 1a7 7 0 0 0-2-1.2L14.2 3H9.8l-.4 2.7a7 7 0 0 0-2 1.2l-2.3-1-2 3.4 2 1.5A7 7 0 0 0 5 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.3-1a7 7 0 0 0 2 1.2l.4 2.7h4.4l.4-2.7a7 7 0 0 0 2-1.2l2.3 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2z"></path></svg>
          </span>
          <span>Settings</span>
        </div>
      </div>

      <div style="flex-grow: 1;"></div>
    </div>

    <!-- footer -->
    <div style="margin: 10px 12px 12px 12px; padding: 9px; background: #0F3336; border: 1px solid #17403F; border-radius: 12px; display: flex; align-items: center; gap: 10px;">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #0E7C86; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 11px; font-weight: 700; color: #FFFFFF;">TA</div>
      <div style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1;">
        <div style="font-size: 11.5px; font-weight: 600; color: #DCF2F0;">Test Admin</div>
        <div style="font-size: 9.5px; color: rgba(192,232,230,0.42);">Administrator</div>
      </div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(192,232,230,0.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
